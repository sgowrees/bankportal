name: Bank Portal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  backend-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Backend Tests
        working-directory: backend
        run: mvn clean test
